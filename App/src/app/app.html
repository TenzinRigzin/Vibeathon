<div class="app-shell" [class.story-layout]="isHome()" [style.--gradient-shift]="scroll.heroProgress()">
  <div class="parallax-blob" [style.transform]="'translate3d(' + (scroll.scrollYValue() * 0.06) + 'px,' + (scroll.scrollYValue() * 0.04) + 'px,0)'">
    <div class="glow-blob glow-blob--1" aria-hidden="true"></div>
  </div>
  <div class="parallax-blob" [style.transform]="'translate3d(' + (scroll.scrollYValue() * -0.04) + 'px,' + (scroll.scrollYValue() * 0.06) + 'px,0)'">
    <div class="glow-blob glow-blob--2" aria-hidden="true"></div>
  </div>
  <div class="parallax-blob parallax-blob--center" [style.transform]="'translate(-50%,-50%) translate3d(0,' + (scroll.scrollYValue() * 0.08) + 'px,0)'">
    <div class="glow-blob glow-blob--3" aria-hidden="true"></div>
  </div>

  <header class="header">
    <a routerLink="/" class="logo">Career Navigator</a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/onboard" routerLinkActive="active">Set profile</a>
      <a routerLink="/gaps" routerLinkActive="active">Skill gaps</a>
      <a routerLink="/roadmap" routerLinkActive="active">30-day roadmap</a>
      <a routerLink="/how-it-works" routerLinkActive="active">How it works</a>
    </nav>
  </header>

  <div class="dashboard" [class.story-layout]="isHome()">
    <div class="glass-container">
      <main class="main">
        <router-outlet />
      </main>
      @if (!isHome()) {
        <aside class="sidebar">
          <app-agent-activity-panel />
        </aside>
      }
    </div>
  </div>

  <footer class="footer">
    <span>Personal Career Navigator — Premium AI operating system for your career.</span>
  </footer>
</div>
