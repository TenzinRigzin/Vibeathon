<!-- Sticky right-side visual: all motion bound to scroll progress (useTransform-style) -->
<div class="narrative-viz" [attr.data-phase]="activeSection()">
  <!-- Phase 0: nodes connecting — line drawing from section1Progress -->
  <div
    class="viz-phase viz-phase--nodes"
    [class.viz-phase--active]="activeSection() === 0"
    [style.opacity]="activeSection() === 0 ? (section1Progress() < 0.05 ? 0 : 1) : 0"
  >
    <div class="nodes-scene">
      <svg class="nodes-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="nvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(20, 184, 166, 0.6)" />
            <stop offset="100%" stop-color="rgba(0, 212, 255, 0.5)" />
          </linearGradient>
        </defs>
        <line x1="50" y1="100" x2="100" y2="60" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <line x1="50" y1="100" x2="100" y2="100" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <line x1="50" y1="100" x2="100" y2="140" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <line x1="100" y1="60" x2="150" y2="100" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <line x1="100" y1="100" x2="150" y2="100" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <line x1="100" y1="140" x2="150" y2="100" class="nv-line" [attr.stroke-dasharray]="lineLen1" [attr.stroke-dashoffset]="lineOffset()" />
        <circle cx="50" cy="100" r="6" class="nv-node nv-node--source" />
        <circle cx="100" cy="60" r="4" class="nv-node" />
        <circle cx="100" cy="100" r="5" class="nv-node nv-node--core" />
        <circle cx="100" cy="140" r="4" class="nv-node" />
        <circle cx="150" cy="100" r="6" class="nv-node nv-node--target" />
      </svg>
    </div>
  </div>

  <!-- Phase 1: progress bars filling from section2Progress -->
  <div
    class="viz-phase viz-phase--bars"
    [class.viz-phase--active]="activeSection() === 1"
    [style.opacity]="activeSection() === 1 ? 1 : 0"
  >
    <div class="bars-scene">
      <p class="bars-label">Gap analysis</p>
      @for (b of bars; track b.name) {
        <div class="bar">
          <span class="bar-name">{{ b.name }}</span>
          <div class="bar-track">
            <div class="bar-fill" [style.width.%]="getBarWidth($index)"></div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Phase 2: timeline revealing from section3Progress -->
  <div
    class="viz-phase viz-phase--timeline"
    [class.viz-phase--active]="activeSection() === 2"
    [style.opacity]="activeSection() === 2 ? 1 : 0"
  >
    <div class="timeline-scene">
      <p class="timeline-label">Roadmap</p>
      <div class="timeline-track"></div>
      @for (t of timeline; track t; let i = $index) {
        <div
          class="timeline-item"
          [class.timeline-item--reveal]="timelineReveal(i)"
          [style.opacity]="timelineReveal(i) ? 1 : 0.35"
          [style.transform]="'translateX(' + (timelineReveal(i) ? 0 : -8) + 'px)'"
        >
          <span class="timeline-dot"></span>
          <span class="timeline-text">{{ t }}</span>
        </div>
      }
    </div>
  </div>
</div>
